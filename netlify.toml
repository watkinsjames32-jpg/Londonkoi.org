[build]
  publish = "."

# London Koi is a static site. Stripe checkout is handled by Stripe-hosted Payment Links / Buy Buttons.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
