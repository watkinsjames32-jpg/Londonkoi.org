[build]
  publish = "."
  functions = "netlify/functions"

# London Koi uses a Netlify Function to create Stripe Checkout Sessions securely.
# Configure STRIPE_SECRET_KEY in Netlify environment variables; never commit it to GitHub.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
