<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="Download your London Koi music purchase.">
  <meta name="theme-color" content="#ff5b6e">
  <title>Your Download | London Koi</title>
  <style>
    :root{--ink:#171218;--cream:#fff8e9;--paper:#fffdf7;--coral:#ff5b6e;--pink:#ed4e98;--aqua:#62ddd1;--sun:#ffd84f;--muted:#645b61;--line:3px solid var(--ink);--shadow:8px 8px 0 var(--ink)}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 Arial,Helvetica,sans-serif}a{color:inherit}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:15px 5%;background:var(--ink);color:#fff;border-bottom:5px solid var(--coral)}.logo{text-decoration:none;font-weight:950;letter-spacing:.12em;font-size:1.3rem}.topbar a.back{text-decoration:none;font-weight:850;font-size:.88rem}.topbar a.back:hover,.topbar a.back:focus{color:var(--sun)}
    main{max-width:840px;margin:auto;padding:64px 6% 80px}.label{font-size:.78rem;font-weight:950;letter-spacing:.18em;text-transform:uppercase}
    h1{font-size:clamp(2.7rem,8vw,4.6rem);line-height:.88;margin:10px 0 18px;text-transform:uppercase;letter-spacing:-.045em}
    .intro{font-size:1.1rem;font-weight:700;color:var(--muted);margin:0 0 30px}
    .panel{border:var(--line);background:var(--paper);box-shadow:var(--shadow);padding:28px}
    .track{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:18px 0;border-bottom:2px solid #ded3ca}.track:first-child{padding-top:0}.track:last-child{border-bottom:0;padding-bottom:0}
    .track-name{font-size:1.15rem;font-weight:950;text-transform:uppercase}.track small{display:block;font-weight:700;color:var(--muted);text-transform:none}
    .btn{display:inline-block;padding:12px 20px;border:var(--line);background:var(--coral);color:#fff;text-decoration:none;text-transform:uppercase;font-weight:950;box-shadow:5px 5px 0 var(--ink);cursor:pointer;transition:.15s}.btn:hover,.btn:focus{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}.btn.alt{background:var(--aqua);color:var(--ink)}.btn.dark{background:var(--ink)}
    .pending{font-weight:850;background:var(--sun);border:2px solid var(--ink);padding:10px 14px;text-transform:uppercase;font-size:.8rem}
    .note{margin-top:26px;font-weight:750}.note a{font-weight:950}
    .problem{border:var(--line);background:#ffe3ef;box-shadow:var(--shadow);padding:28px}.problem h2{margin:0 0 10px;text-transform:uppercase}
    footer{background:var(--ink);color:#fff;padding:28px 6%;text-align:center;font-weight:750}
    @media(max-width:560px){.track{grid-template-columns:1fr}.track .btn,.track .pending{justify-self:start;text-align:center}}
  </style>
</head>
<body>
<header class="topbar"><a class="logo" href="/">LONDON KOI</a><a class="back" href="/#music">Back to Music &amp; Merch</a></header>
<main>
  <div class="label">Thank you</div>
  <h1>Your Music</h1>
  <p class="intro" id="intro">Confirming your payment with Stripe…</p>
  <div id="panel"></div>
  <p class="note">Questions about an order? Email <a href="mailto:maxx41111@gmail.com">maxx41111@gmail.com</a>.</p>
</main>
<footer>© 2026 London Koi. All rights reserved.</footer>
<script>
(function () {
  var intro = document.getElementById('intro');
  var panel = document.getElementById('panel');
  var sessionId = new URLSearchParams(window.location.search).get('session_id');

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
    });
  }

  function showProblem(heading, message) {
    intro.textContent = '';
    panel.innerHTML =
      '<div class="problem"><h2>' + escapeHtml(heading) + '</h2><p>' + escapeHtml(message) +
      '</p><p><a class="btn dark" href="/#music">Return to the store</a></p></div>';
  }

  if (!sessionId) {
    showProblem('Nothing to download', 'Open this page from the Stripe receipt link you were sent after paying.');
    return;
  }

  fetch('/api/purchase?session_id=' + encodeURIComponent(sessionId))
    .then(function (response) {
      return response.json().then(function (data) {
        return { ok: response.ok, data: data };
      });
    })
    .then(function (result) {
      if (!result.ok) {
        showProblem('We could not release your download', result.data.error || 'Please try again in a moment.');
        return;
      }

      var downloads = result.data.downloads || [];

      if (!downloads.length) {
        intro.textContent = 'Payment confirmed. Thank you for supporting London Koi.';
        panel.innerHTML =
          '<div class="panel"><p><strong>This order has no files to download.</strong></p>' +
          '<p>Physical orders are shipped and confirmed by email.</p></div>';
        return;
      }

      var expires = new Date(result.data.expiresAt);
      intro.textContent =
        'Payment confirmed' + (result.data.email ? ' for ' + result.data.email : '') +
        '. Your download' + (downloads.length > 1 ? 's stay' : ' stays') + ' available until ' +
        expires.toLocaleDateString() + '.';

      panel.innerHTML =
        '<div class="panel">' +
        downloads
          .map(function (track) {
            var action = track.ready
              ? '<a class="btn" href="' + escapeHtml(track.url) + '">Download</a>'
              : '<span class="pending">Being uploaded</span>';
            var caption = track.ready ? escapeHtml(track.filename) : 'We will email this file to you shortly.';
            return (
              '<div class="track"><div><div class="track-name">' + escapeHtml(track.name) +
              '</div><small>' + caption + '</small></div>' + action + '</div>'
            );
          })
          .join('') +
        '</div>';
    })
    .catch(function () {
      showProblem('Connection problem', 'We could not reach the download service. Refresh this page to try again.');
    });
})();
</script>
</body>
</html>
